apiVersion: apps/v1
kind: Deployment
metadata:
  name: interviewx
  labels:
    app: interviewx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: interviewx
  template:
    metadata:
      labels:
        app: interviewx
    spec:
      containers:
        - name: interviewx
          image: ghcr.io/skit-devops-2026/devops-24eskcs085:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
