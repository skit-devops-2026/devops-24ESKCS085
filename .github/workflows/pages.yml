name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site with health file
        run: |
          mkdir -p _site
          cp *.html style.css script.js _site/ 2>/dev/null || true
          cp *.jpg *.jpeg _site/ 2>/dev/null || true
          printf '{"status":"ok","commit":"%s"}' "${{ github.sha }}" > _site/health
          cp _site/health _site/health.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
